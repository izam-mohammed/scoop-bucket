# Every manifest must be valid JSON in the generator's format, match Scoop's
# schema, and point at downloads whose sha256 matches the recorded hash.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: valid json, 4-space indent, trailing newline
        run: |
          git ls-files '*.json' | python3 -c '
          import json, sys
          bad = 0
          for path in sys.stdin.read().split():
              text = open(path, encoding="utf-8").read()
              try:
                  want = json.dumps(json.loads(text), indent=4, ensure_ascii=False) + "\n"
              except ValueError as e:
                  print(f"::error file={path}::not valid json: {e}")
                  bad = 1
                  continue
              if text != want:
                  print(f"::error file={path}::not formatted (4-space indent, one trailing newline)")
                  bad = 1
              else:
                  print(f"ok  {path}")
          sys.exit(bad)
          '

      # Scoop's own schema, pinned to a commit so a change upstream can't
      # break this check without a pull request here.
      - name: scoop schema
        run: |
          git ls-files -z '*.json' | xargs -0 uvx check-jsonschema@0.38.2 \
            --schemafile https://raw.githubusercontent.com/ScoopInstaller/Scoop/e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f/schema.json

      - name: downloads exist and hashes match
        run: |
          set -eu
          fail=0
          for f in $(git ls-files '*.json'); do
            jq -r '[., (.architecture // {} | .[])] | .[]
              | select(.url != null)
              | [(.url | if type == "array" then .[] else . end)] as $u
              | [(.hash | if type == "array" then .[] else . end)] as $h
              | range(0; $u | length) | "\($u[.]) \($h[.])"' "$f" |
            while read -r url hash; do
              got=$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1)
              if [ "$got" = "${hash#sha256:}" ]; then
                echo "ok    $f $url"
              else
                echo "::error file=$f::hash mismatch for $url: manifest $hash, download $got"
                exit 1
              fi
            done || fail=1
          done
          exit "$fail"
